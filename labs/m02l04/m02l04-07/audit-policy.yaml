# Security Operations & Threat Hunting (SOC) — lesson m02l04 — Windows Event Logs, Sysmon & Linux Auditd Telemetry
# https://learnsome.tech/courses/secops-course/watch?lesson=m02l04
# © LearnSome.tech
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Secrets: record who and when, never the secret itself
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  # Interactive access to containers: keep the request too
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
  # High volume, low value
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  # Everything else
  - level: Metadata
