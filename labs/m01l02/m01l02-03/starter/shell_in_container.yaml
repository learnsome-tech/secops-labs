- rule: Shell spawned in container
  desc: A shell process started inside a running container
  condition: >
    spawned_process and container
    and proc.name in (sh, bash, ash, dash)
  output: >
    Shell in container (ns=%k8s.ns.name pod=%k8s.pod.name
    parent=%proc.pname cmdline=%proc.cmdline
    image=%container.image.repository)
  priority: WARNING
  tags: [container, shell, mitre_execution]
  exceptions:
    - name: nightly_db_backup
      fields: [k8s.ns.name, proc.pname, proc.cmdline]
      values:
        - [backup, cron, "sh -c /usr/local/bin/backup.sh"]
