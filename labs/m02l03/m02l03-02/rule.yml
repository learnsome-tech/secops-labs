title: PowerShell Launched With an Encoded Command
id: 6f1c2b0e-8a4d-4e57-b3c9-2d7e9a1f4c58
status: test
description: powershell.exe or pwsh.exe started with -EncodedCommand
author: SOC detection team
date: 2026-03-03
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: ['\powershell.exe', '\pwsh.exe']
  selection_cli:
    CommandLine|contains: [' -enc ', ' -encodedcommand ']
  filter_sccm:
    ParentImage|endswith: '\CcmExec.exe'
  condition: all of selection_* and not 1 of filter_*
level: high
